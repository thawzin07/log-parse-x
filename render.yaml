databases:
  - name: logparsex-db
    plan: free
    databaseName: logparsex
    user: logparsex

services:
  - type: web
    name: logparsex-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logparsex-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://logparsex-web.onrender.com
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: logparsex-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://logparsex-api.onrender.com
